<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>StockD · 재고와 주문 관리 시안</title>
  <style>
    :root {
      --navy: #ffffff;
      --ink: #203c37;
      --muted: #61756f;
      --blue: #16816a;
      --line: #dce7e3;
      --canvas: #f3f6f5;
      --green: #16816a;
      --mint-light: #eaf6f1;
      --amber: #976116;
      --red: #bd3c3c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    button, input, select { font: inherit; }
    button, a, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    a { color: var(--blue); text-underline-offset: 3px; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .table-wrap:focus-visible { outline: 3px solid #57ac96; outline-offset: 3px; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--navy); color: var(--ink); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 32px 16px 24px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 13px; }
    .brand-mark { width: 28px; height: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .brand-mark i { display: block; border: 2px solid var(--green); border-radius: 2px; }
    .brand-mark i:nth-child(3) { background: #b9e3d6; }
    .brand strong { font-size: 24px; font-weight: 750; letter-spacing: -.7px; }
    .brand-sub { margin: 12px 13px 33px; font-size: 12px; color: var(--muted); }
    .nav { display: grid; gap: 7px; }
    .nav button { width: 100%; background: transparent; border: 0; border-radius: 5px; color: #586c65; padding: 12px 13px; text-align: left; display: flex; gap: 12px; align-items: center; font-weight: 600; }
    .nav button:hover { background: #f1f6f3; color: var(--ink); }
    .nav button[aria-current="page"] { background: var(--mint-light); color: #146c59; }
    .nav-count { margin-left: auto; font-size: 11px; background: #fff2db; color: #8b5410; border-radius: 3px; padding: 0 6px; }
    .sidebar-bottom { margin-top: auto; padding: 24px 13px 0; color: var(--muted); font-size: 12px; }
    .sidebar-bottom strong { color: var(--ink); display: block; margin-bottom: 5px; }
    .sidebar-bottom a { color: var(--blue); display: inline-block; margin-top: 15px; }
    .workspace { min-width: 0; }
    .preview-strip { background: var(--mint-light); border-bottom: 1px solid #cce6db; color: #356757; padding: 11px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; }
    .preview-strip p { margin: 0; }
    .preview-strip strong { font-weight: 750; }
    .preview-strip button { border: 0; padding: 2px 0; background: transparent; color: #356757; text-decoration: underline; white-space: nowrap; }
    .topbar { min-height: 66px; border-bottom: 1px solid var(--line); background: white; padding: 17px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .workspace-label { display: flex; align-items: center; gap: 9px; font-weight: 650; }
    .workspace-label .icon { color: #78879a; width: 17px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 12px; }
    .read-only { padding: 3px 9px; background: #f0f3f8; color: #5c6c81; border-radius: 3px; }
    main { max-width: 1600px; margin: 0 auto; padding: 30px 32px 48px; }
    .page-heading { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; margin-bottom: 24px; }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 8px; font-weight: 750; letter-spacing: -1.1px; }
    .page-heading p { color: var(--muted); margin: 0; max-width: 75ch; }
    .reference-time { font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; }
    .reference-time strong { display: block; color: #43546b; font-size: 13px; font-weight: 600; }
    h2 { font-size: 18px; font-weight: 750; letter-spacing: -.5px; line-height: 1.45; margin: 0; }
    h3 { font-size: 15px; margin: 0; font-weight: 700; }
    p { margin: 0 0 12px; }
    .panel { background: white; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .panel-heading { padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); }
    .panel-heading p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .panel-body { padding: 20px 22px; }
    .dashboard-top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 22px; margin-bottom: 24px; }
    .pill { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 3px; font-size: 12px; line-height: 1.8; font-weight: 600; white-space: nowrap; }
    .sample { color: #5c6c81; background: #eff3f8; }
    .state-normal { color: #23704f; background: #edf7f1; }
    .state-low, .state-stale { color: #885611; background: #fff4e1; }
    .state-zero, .state-failed { color: #b23535; background: #fdeeee; }
    .state-unsupported, .state-unmanaged { color: #687587; background: #eff2f6; }
    .state-unverified { color: #525cac; background: #f0f0ff; }
    .channel { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .channel::before { content: ""; display: block; width: 6px; height: 6px; border-radius: 50%; background: #14a765; }
    .channel.coupang::before { background: #e26038; }
    .task-row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 13px; align-items: center; padding: 18px 22px; border-bottom: 1px solid #e9edf3; }
    .task-row:last-child { border-bottom: 0; }
    .task-icon { width: 36px; height: 36px; background: #fff4e1; color: #976116; display: grid; place-items: center; border-radius: 4px; }
    .task-icon.blue { background: var(--mint-light); color: var(--green); }
    .task-row p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
    .text-button { background: transparent; border: 0; color: var(--blue); padding: 6px 0; font-weight: 600; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
    .text-button .icon { width: 15px; height: 15px; }
    .connection-row { padding: 17px 22px; border-bottom: 1px solid #e9edf3; }
    .connection-row:last-child { border-bottom: 0; }
    .connection-row .first-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .connection-row p { font-size: 12px; color: var(--muted); margin: 5px 0 0; }
    .neutral-note { padding: 13px 22px; background: #f8fafc; color: var(--muted); font-size: 12px; }
    .notice { display: flex; align-items: flex-start; gap: 9px; background: #edf5f1; color: #416457; padding: 13px 16px; border-radius: 4px; font-size: 12px; margin: 0 0 18px; }
    .notice .icon { width: 17px; height: 17px; margin-top: 2px; }
    .notice p { margin: 0; }
    .notice.warning { background: #fff6e8; color: #855a24; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .field { display: grid; gap: 5px; min-width: 122px; }
    .field label { font-size: 12px; color: #55667c; font-weight: 600; }
    .field.search-field { flex: 1 1 230px; }
    .search-input { position: relative; }
    .search-input .icon { width: 17px; height: 17px; position: absolute; left: 12px; top: 12px; color: #8895a7; }
    input, select { background: white; color: var(--ink); border: 1px solid #cfd8e5; border-radius: 4px; min-height: 40px; width: 100%; padding: 8px 11px; }
    .search-input input { padding-left: 37px; }
    input::placeholder { color: #8a97a9; }
    .button { min-height: 40px; background: white; color: #40516b; border: 1px solid #cfd8e5; border-radius: 4px; padding: 8px 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .button.primary { background: var(--blue); color: white; border-color: var(--blue); }
    .button:hover { background: #f3f6fb; }
    .button.primary:hover { background: #126c59; }
    .button.small { min-height: 32px; font-size: 12px; padding: 5px 10px; }
    .result-summary { display: flex; justify-content: space-between; gap: 12px; padding: 13px 22px; font-size: 12px; color: var(--muted); }
    .result-summary strong { color: #44546c; }
    .table-wrap { width: 100%; overflow-x: auto; }
    .scroll-hint { display: none; margin: 0; padding: 10px 18px; background: #f7f9fc; border-top: 1px solid var(--line); color: #5c6d83; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; text-align: left; font-size: 14px; }
    th { background: #f5f8f6; color: #536b60; font-size: 12px; font-weight: 650; padding: 12px 17px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: top; }
    th span { display: block; font-weight: 400; margin-top: 3px; color: #8290a2; }
    td { padding: 16px 17px; border-bottom: 1px solid #e8edf4; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcff; }
    .comparison-table { min-width: 760px; }
    .inventory-table { min-width: 1040px; }
    .orders-table { min-width: 1050px; }
    .mapping-table { min-width: 940px; }
    .product-button { background: none; border: 0; padding: 0; color: var(--ink); font-size: 14px; font-weight: 650; text-align: left; line-height: 1.5; }
    .product-button:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
    .secondary { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .sku { font-size: 12px; color: #62758c; letter-spacing: .2px; }
    .number { font-variant-numeric: tabular-nums; font-weight: 750; font-size: 17px; text-align: right; }
    .number.zero { color: var(--red); }
    .number.low { color: var(--amber); }
    .number.none { color: #8a98a9; }
    .right { text-align: right; }
    .center { text-align: center; }
    .amount-cell { min-width: 110px; }
    .amount-cell .pill { margin-top: 4px; }
    .timestamp { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .table-footnote { padding: 13px 22px; background: #fbfcfe; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .section-gap { margin-top: 24px; }
    .empty { padding: 50px 20px; text-align: center; }
    .empty h3 { margin: 0 0 5px; }
    .empty p { color: var(--muted); font-size: 13px; }
    .empty .button { margin-top: 8px; }
    .connection-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
    .status-block { border-bottom: 1px solid var(--line); padding: 20px 22px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .status-block strong { display: block; font-size: 18px; }
    .status-block p { color: var(--muted); font-size: 12px; margin: 3px 0 0; }
    .status-dot { background: #eff3f8; color: #687a90; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .key-value { display: grid; grid-template-columns: 126px minmax(0,1fr); gap: 11px 16px; margin: 0; font-size: 13px; }
    .key-value dt { color: var(--muted); }
    .key-value dd { margin: 0; overflow-wrap: anywhere; }
    .steps { padding-left: 19px; margin: 18px 0; }
    .steps li { padding: 0 0 13px 5px; }
    .steps li::marker { color: #5474a5; font-weight: 750; }
    .steps strong { display: block; }
    .steps span { color: var(--muted); font-size: 12px; }
    .links { display: flex; flex-wrap: wrap; gap: 9px 18px; font-size: 12px; }
    .setting-row { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .setting-row p { color: var(--muted); font-size: 12px; margin: 3px 0 0; }
    .threshold-field { width: 95px; }
    .alert-tabs { display: flex; gap: 20px; padding: 0 22px; border-bottom: 1px solid var(--line); }
    .alert-tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 15px 2px; color: var(--muted); font-weight: 600; }
    .alert-tabs button[aria-pressed="true"] { border-bottom-color: var(--blue); color: var(--blue); }
    .alert-item { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 15px; align-items: flex-start; padding: 22px; border-bottom: 1px solid #e8edf4; }
    .alert-item:last-child { border-bottom: 0; }
    .alert-item p { margin: 5px 0; color: var(--muted); font-size: 12px; }
    .alert-item .pill { margin-right: 5px; }
    .alert-item.acknowledged { background: #fafbfd; }
    .alert-item.acknowledged h3 { color: #6b7a8e; }
    .mapping-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .candidate-select { width: 180px; min-height: 33px; padding: 5px 8px; font-size: 12px; }
    .history-list { margin: 0; padding: 0; list-style: none; }
    .history-list li { padding: 12px 22px; border-bottom: 1px solid #e8edf4; font-size: 12px; }
    .history-list li:last-child { border: 0; }
    .history-list span { color: var(--muted); margin-right: 12px; }
    .footer-note { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #7e8c9f; margin: 23px 0 0; }
    .footer-note .icon { width: 14px; height: 14px; }
    dialog { border: 1px solid #ccd6e4; padding: 0; width: min(680px,calc(100% - 32px)); max-height: calc(100% - 48px); border-radius: 8px; color: var(--ink); background: white; }
    dialog::backdrop { background: rgba(16,32,53,.46); }
    .dialog-heading { padding: 23px 26px 19px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .dialog-heading h2 { font-size: 21px; }
    .dialog-heading p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; background: white; border: 1px solid var(--line); border-radius: 4px; flex-shrink: 0; }
    .dialog-body { padding: 22px 26px 26px; }
    .dialog-body .notice { margin-top: 18px; }
    .dialog-body h3 { margin: 21px 0 10px; }
    .dialog-body p { font-size: 13px; color: #576b83; }
    .dialog-body .key-value { grid-template-columns: 145px minmax(0,1fr); }
    .detail-quantity { padding: 17px 20px; background: #f2f8f5; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-left: 3px solid #65ab95; }
    .detail-quantity .number { font-size: 30px; }
    .detail-quantity .secondary { font-size: 12px; }
    .toast { position: fixed; bottom: 24px; left: calc(50% + 104px); transform: translateX(-50%); background: #244d40; color: white; border-radius: 5px; padding: 14px 20px; width: max-content; max-width: calc(100% - 32px); font-size: 13px; z-index: 10; box-shadow: 0 4px 18px rgba(20,40,60,.15); }
    .toast[hidden] { display: none; }
    .review-intro { display: flex; align-items: center; gap: 18px; padding: 22px; background: #f7fbf8; border-bottom: 1px solid var(--line); }
    .box-guide { width: 70px; height: 70px; flex: 0 0 70px; }
    .review-intro h2 { margin-bottom: 3px; }
    .review-intro p { font-size: 12px; color: var(--muted); margin: 0; }
    .review-progress { padding: 17px 22px; border-bottom: 1px solid var(--line); }
    .progress-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .progress-label strong { font-size: 14px; }
    .progress-label span { font-size: 11px; color: var(--muted); }
    #reviewProgress, #dailyProgress { display: block; width: 100%; height: 8px; appearance: none; border: 0; border-radius: 2px; overflow: hidden; background: #e4ede8; accent-color: var(--green); }
    #reviewProgress::-webkit-progress-bar, #dailyProgress::-webkit-progress-bar { background: #e4ede8; }
    #reviewProgress::-webkit-progress-value, #dailyProgress::-webkit-progress-value { background: var(--green); }
    #reviewProgress::-moz-progress-bar, #dailyProgress::-moz-progress-bar { background: var(--green); }
    .review-progress > p { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .mission-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 8px; }
    .mission-state { font-size: 11px; color: #718178; white-space: nowrap; }
    .mission-state.complete { color: #146c59; font-weight: 650; }
    .badge-line { display: flex; flex-wrap: wrap; gap: 9px; padding: 15px 22px; background: #fcfdfc; border-top: 1px solid var(--line); }
    .badge-caption { width: 100%; font-size: 11px; color: var(--muted); }
    .achievement-badge { display: inline-flex; gap: 6px; align-items: center; border: 1px solid #dce5df; border-radius: 4px; color: #66786c; padding: 4px 8px; font-size: 11px; }
    .achievement-badge .icon { width: 14px; height: 14px; }
    .achievement-badge.earned { background: var(--mint-light); color: #146c59; border-color: #bcdccd; }
    .mission-case-list { display: grid; gap: 12px; }
    .mission-case { border: 1px solid var(--line); border-radius: 5px; padding: 16px; }
    .mission-case h3 { margin: 0; }
    .mission-case p { margin: 10px 0 0; }
    .mission-case-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .mission-case .number { flex-shrink: 0; font-size: 25px; }
    .mission-case .quantity-label { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    .mission-record { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .mission-record p { margin: 0; font-size: 12px; max-width: 39ch; }
    .review-confirmation { color: #146c59 !important; font-weight: 600; margin: 12px 0 0; }
    .daily-date { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
    .daily-task .text-button { min-height: 44px; }
    .daily-task.complete .task-icon { background: var(--mint-light); color: #146c59; }
    .daily-task .daily-task-state { font-size: 12px; font-weight: 650; color: var(--muted); }
    .daily-task.complete .daily-task-state { color: #146c59; }
    .daily-history { padding: 16px 22px 18px; }
    .daily-history-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px 12px; font-size: 12px; margin-bottom: 11px; }
    .daily-history-heading span { color: var(--muted); }
    .daily-stamps { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 6px; list-style: none; padding: 0; margin: 0; }
    .daily-stamp { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 11px; }
    .daily-stamp .icon { width: 17px; height: 17px; }
    .daily-stamp.done { color: #146c59; border-color: #aad4c5; background: var(--mint-light); }
    .daily-stamp.today { outline: 1px solid #578e7e; outline-offset: 2px; }
    .daily-history-note { margin: 12px 0 0; color: var(--muted); font-size: 11px; }
    .sample-practice { border-top: 1px solid var(--line); background: #fcfdfc; }
    .sample-practice > summary { min-height: 48px; padding: 13px 22px; cursor: pointer; font-weight: 650; font-size: 13px; }
    .sample-practice > summary span { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 7px; }
    .practice-body { border-top: 1px solid var(--line); }
    .daily-view-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 17px; margin-bottom: 16px; border: 1px solid #cce6db; border-radius: 5px; background: var(--mint-light); font-size: 12px; }
    .daily-view-note p { margin: 0; }
    .daily-view-note .text-button { min-height: 44px; }
    .daily-reset-button { min-height: 44px !important; flex-shrink: 0; }
    .story-invite { display: flex; align-items: center; gap: 14px; margin: 0 22px 18px; padding: 15px; border: 1px solid #dce7e3; border-radius: 6px; background: #eaf6f1; color: #203c37; }
    .story-invite .box-guide { width: 46px; height: 46px; flex-basis: 46px; }
    .story-invite-copy { flex: 1; min-width: 0; }
    .story-invite h3 { margin: 0; font-size: 14px; }
    .story-invite p { margin: 4px 0 0; font-size: 12px; }
    .story-invite small { display: block; margin-top: 4px; color: #576b63; font-size: 11px; }
    .story-invite .button, .story-reader .button, .story-cut { min-height: 44px; }
    .story-invite .button { flex-shrink: 0; }
    button:disabled { cursor: default; }
    .story-invite .button:disabled { background: #f6faf8; color: #657970; border-color: #c9d8d1; }
    dialog:has(.story-reader) { width: min(820px, calc(100vw - 32px)); }
    dialog:has(.story-reader) .icon-button { min-width: 44px; min-height: 44px; }
    .story-scene { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: center; }
    #storySceneArt { display: block; width: 100%; border-radius: 8px; background: #eaf6f1; }
    .story-scene-copy { min-width: 0; }
    .dialog-body .story-chapter { margin: 0 0 7px; color: #16816a; font-size: 12px; font-weight: 650; }
    .dialog-body #storySceneTitle { font-size: 20px; color: #203c37; margin: 0 0 12px; }

    function inventoryDetail(id) {
      const item = inventory.find(row => row.id === id);
      showDialog(item.name,`${item.option} · 샘플 데이터 · 실제 API 미연동`, `<div class="detail-quantity"><div><strong>${quantityMeaning(item)}</strong><span class="secondary">${channelLabel(item)} / ${fulfillmentLabel(item)} ${badge(item)}</span></div><span class="number ${quantityClass(item)}">${quantity(item)}${item.quantity !== null ? '<span style="font-size:13px;font-weight:400"> 개</span>' : ''}</span></div><dl class="key-value"><dt>내부 SKU</dt><dd>${item.sku || '미연결 · 상품 연결에서 후보 확인'}</dd><dt>샘플 계정</dt><dd>${accountLabel(item)}</dd><dt>원본 옵션 ID 예시</dt><dd>${item.externalId}</dd><dt>마지막 성공 예시</dt><dd>${item.lastSuccess ? `2026.10.04 ${item.lastSuccess}` : '없음 · 수량 확인 전'}</dd><dt>최근 시도 예시</dt><dd>2026.10.04 ${item.lastAttempt}</dd><dt>최근 조회 결과 예시</dt><dd>${item.state === 'stale' || item.state === 'failed' ? '조회 실패 · 원인 확인 필요 (가상 오류)' : stateLabels[item.state]}</dd><dt>데이터 출처</dt><dd>HTML 내부의 가상 샘플 · 실제 계정 응답 아님</dd></dl><div class="notice ${['stale','failed'].includes(item.state) ? 'warning' : ''}">${icon('info')}<p>${item.detail}</p></div><p>채널별 수량을 실제 창고 보유량으로 합산하지 않습니다. 판매수량은 재고에 반영하지 않습니다.</p>${item.fulfillment === 'rocket' ? '<div class="links"><a href="https://developers.coupang.com/ko/api/rocket-growth/rg-inventory-api" target="_blank" rel="noopener noreferrer">로켓그로스 재고 공식 근거</a></div>' : ''}`);
    }
    function orderDetail(id) {
      const order = orders.find(row => row.id === id);
      showDialog('주문 행 상세',`${order.id} · 개인정보 없는 샘플`, `<dl class="key-value"><dt>상품 / 판매 옵션</dt><dd>${order.name} / ${order.option}</dd><dt>내부 SKU</dt><dd>${order.sku}</dd><dt>채널 / 배송 방식</dt><dd>${channelLabel(order)} / ${fulfillmentLabel(order)}</dd><dt>샘플 계정</dt><dd>${accountLabel(order)}</dd><dt>예시 결제 시각</dt><dd>${order.date} ${order.time}</dd><dt>주문 행 수량</dt><dd>${order.quantity}개${order.fulfillment === 'rocket' ? ' · salesQuantity 예시, 재고 아님' : ''}</dd><dt>조회한 원본 상태</dt><dd>${order.original}</dd><dt>클레임 예시</dt><dd>${order.claim}${order.claimQuantity ? ` / 전체 ${order.quantity}개 중 ${order.claimQuantity}개` : ''}</dd><dt>데이터 출처</dt><dd>가상 샘플 · 실제 주문 응답 아님</dd></dl>${order.fulfillment === 'rocket' ? '<div class="notice warning">'+icon('info')+'<p><strong>출고 이후 조회되는 주문의 예시입니다.</strong> 결제 직후 주문 전체와 상태 변경은 확인할 수 없습니다. 취소·반품·교환 지원도 미확인으로 표시하며 추정하지 않습니다.</p></div><div class="links"><a href="https://developers.coupang.com/ko/api/rocket-growth/rg-order-apilist-query" target="_blank" rel="noopener noreferrer">로켓그로스 주문 공식 근거</a></div>' : '<div class="notice">'+icon('info')+'<p>주문 행의 수량과 부분 클레임을 각각 보존합니다. 화면은 조회용이며 발송·취소·주문 상태를 바꾸지 않습니다.</p></div>'}`);
    }
    function connectionDetail(channel) {
      const naver = channel === 'naver';
      showDialog(naver ? '스마트스토어 연결 범위' : '쿠팡 연결 범위', '실제 미연결 · 공식 문서 확인 2026.10.04 · 계정 검증 대기', `<dl class="key-value"><dt>실제 연결 상태</dt><dd>미연결 · 키 등록과 실제 호출 없음</dd><dt>조회할 정보</dt><dd>상품·옵션·재고·주문·지원되는 클레임</dd><dt>조회 방식</dt><dd>${naver ? '원상품 상세와 옵션 재고, 변경된 상품주문 ID와 상세 조회' : '판매자배송과 로켓그로스의 재고·주문을 별도 조회'}</dd><dt>수량 의미</dt><dd>${naver ? '채널 등록 재고 · 표준형 옵션 관리 여부를 함께 확인' : '판매자배송 등록 재고 / RG 주문가능 재고 분리'}</dd><dt>실제 검증</dt><dd>키·권한·발신 IP, 전체 페이지, 판매자센터 대조 모두 대기</dd></dl><div class="notice warning">${icon('info')}<p>${naver ? '표준형 옵션에서 관리 미사용을 수량 9,999만으로 판단하지 않습니다. 관리 여부를 확인하고 수량을 비워 표시합니다.' : 'RG 주문은 출고 이후 조회됩니다. 상태 변경과 취소·반품·교환 지원은 미확인입니다. 재고 조회의 주문가능 수량과 주문의 판매수량을 구분합니다.'}</p></div><div class="links">${naver ? '<a href="https://apicenter.commerce.naver.com/docs/commerce-api/current/read-origin-product-product" target="_blank" rel="noopener noreferrer">공식 상품·재고 조회</a><a href="https://apicenter.commerce.naver.com/docs/commerce-api/current/seller-get-last-changed-status-pay-order-seller" target="_blank" rel="noopener noreferrer">공식 변경 주문 조회</a>' : '<a href="https://developers.coupang.com/ko/api/products/query-quantitypricestatus-by-product-items" target="_blank" rel="noopener noreferrer">판매자배송 재고 근거</a><a href="https://developers.coupang.com/ko/api/rocket-growth/rg-inventory-api" target="_blank" rel="noopener noreferrer">RG 재고 근거</a><a href="https://developers.coupang.com/ko/api/rocket-growth/rg-order-apilist-query" target="_blank" rel="noopener noreferrer">RG 주문 근거</a>'}</div>`);
    }
    function notify(message) { clearTimeout(toastTimer); const toast = document.getElementById('toast'); toast.textContent = message; toast.hidden = false; toastTimer = setTimeout(() => { toast.hidden = true; }, 4200); }
    function mappingChange(id, approve) {
      const item = inventory.find(row => row.id === id);
      const mapping = mappings.find(row => row.id === id);
      const previous = item.sku;
      if ((approve && item.sku) || (!approve && !item.sku)) return;
      item.sku = approve ? mapping.chosen : null;
      if (approve) {
        state.badges.firstLink = true;
        if (mappings.every(row => inventory.find(entry => entry.id === row.id)?.sku)) state.badges.reviewRound = true;
      }
      state.history.unshift({ time: '시안에서 방금', text: `${accountLabel(item)} / ${item.externalId} → ${approve ? `${item.sku} 샘플 연결 승인` : `${previous} 샘플 연결 해제`}` });
      render();
      notify(approve ? `샘플 연결 ${mappings.filter(row => inventory.find(entry => entry.id === row.id)?.sku).length}/3개 · 현재 화면에서만 유지됩니다.` : '샘플 연결을 해제했습니다. 연결 미션 진행도 함께 바뀝니다.');
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.view) { go(button.dataset.view); return; }
      const action = button.dataset.action;
      const id = button.dataset.id;
      if (action === 'dialog-close') dialog.close();
      else if (action === 'about') showDialog('StockD 화면 시안', 'HTML 파일 하나로 살펴보는 미리보기', '<p>네이버 스마트스토어와 쿠팡의 상품·재고·주문을 조회하는 첫 화면 구성입니다. 모든 상품·수량·주문·조회 시각은 가상 샘플입니다.</p><p>오늘의 확인 미션은 페이지 열기와 재고·주문 화면 방문으로 자동 완료됩니다. 한국 날짜 기준의 확인 기록과 연재 이야기 진행을 이 브라우저에 저장하며, 나머지 샘플 연결·알림·연습 조작은 새로고침하면 초기화됩니다.</p><div class="notice">'+icon('info')+'<p><strong>실제 API·DB·로그인 미연결</strong><br>키를 입력받지 않으며 외부 API 요청·쇼핑몰 재고 수정·발송·주문 상태 변경을 수행하지 않습니다. 실제 운영 통계와 알림은 없습니다.</p></div><div class="links"><a href="https://app.notion.com/p/3ef15a85fa868135ae78d2102a1ad7b1" target="_blank" rel="noopener noreferrer">기획·요건·API 연결 문서</a></div>');
      else if (action === 'inventory-detail') inventoryDetail(id);
      else if (action === 'order-detail') orderDetail(id);
      else if (action === 'connection-detail') connectionDetail(button.dataset.channel);
      else if (action === 'mission-open') missionDetail(id);
      else if (action === 'mission-review') markMissionReview(id);
      else if (action === 'daily-reset') resetDailyChecks();
      else if (action === 'story-open') openStory();
      else if (action === 'story-select') openStory(Number(button.dataset.storyIndex), `[data-story-index="${button.dataset.storyIndex}"]`);
      else if (action === 'story-prev') openStory(storyState.viewIndex - 1, '[data-action="story-prev"]');
      else if (action === 'story-next') openStory(storyState.viewIndex + 1, '[data-action="story-next"]');
      else if (action === 'inventory-attention' || action === 'inventory-errors') { state.inventoryFilters = { search: '', channel: '', fulfillment: '', status: action === 'inventory-attention' ? 'attention' : 'errors' }; go('inventory'); }
      else if (action === 'inventory-reset') { state.inventoryFilters = { search: '', channel: '', fulfillment: '', status: '' }; render(); }
      else if (action === 'order-reset') { state.orderFilters = { search: '', channel: '', fulfillment: '', status: '', from: '2026-10-03', to: '2026-10-04' }; render(); }
      else if (action === 'mapping-approve' || action === 'mapping-release') mappingChange(id,action === 'mapping-approve');
      else if (action === 'alert-filter') { state.alertFilter = button.dataset.filter; render(); }
      else if (action === 'alert-acknowledge') { alerts.find(alert => alert.id === id).acknowledged = true; render(); notify('알림 예시를 확인했습니다. 재고·조회 오류 상태는 그대로 유지됩니다.'); }
      else if (action === 'alert-detail') { const alert = alerts.find(row => row.id === id); if (alert.item) inventoryDetail(alert.item); else go(alert.target); }
      else if (action === 'sample-reset') { inventory.filter(item => ['c2','c3','n5'].includes(item.id)).forEach(item => { item.sku = null; }); alerts.forEach(alert => { alert.acknowledged = false; }); state.threshold = 5; state.history = []; state.missions = { stock: false, sync: false }; state.badges = { firstLink: false, reviewRound: false }; state.effects = true; render(); notify('샘플 연결·알림·검토 진행·배지를 초기화했습니다.'); }
    });
    document.addEventListener('input', event => {
      const input = event.target;
      if (input.id === 'inventorySearch') { state.inventoryFilters.search = input.value; renderInventoryResults(); }
      if (input.id === 'orderSearch') { state.orderFilters.search = input.value; renderOrderResults(); }
    });
    document.addEventListener('change', event => {
      const input = event.target;
      const inventoryKeys = { inventoryChannel: 'channel', inventoryFulfillment: 'fulfillment', inventoryStatus: 'status' };
      const orderKeys = { orderChannel: 'channel', orderFulfillment: 'fulfillment', orderStatus: 'status', orderFrom: 'from', orderTo: 'to' };
      if (inventoryKeys[input.id]) { state.inventoryFilters[inventoryKeys[input.id]] = input.value; renderInventoryResults(); }
      if (orderKeys[input.id]) { state.orderFilters[orderKeys[input.id]] = input.value; renderOrderResults(); }
      if (input.dataset.mappingId) mappings.find(mapping => mapping.id === input.dataset.mappingId).chosen = input.value;
      if (input.id === 'thresholdInput') {
        const threshold = Number(input.value);
        if (!Number.isInteger(threshold) || threshold < 0 || threshold > 999 || input.value === '') { input.value = state.threshold; notify('예시 기준은 0부터 999 사이의 정수로 입력해 주세요.'); return; }
        state.threshold = threshold;
        notify(`예시 숫자 강조 기준을 ${threshold}개로 바꿨습니다. 실제 경보는 생성되지 않습니다.`);
      }
      if (input.id === 'motionToggle') { state.effects = input.checked; document.body.dataset.effects = state.effects ? 'on' : 'off'; notify(state.effects ? '샘플 확인 효과를 켰습니다.' : '샘플 확인 효과를 껐습니다.'); }
    });
    dialog.addEventListener('click', event => { if (event.target === dialog) { const bounds = dialog.getBoundingClientRect(); if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close(); } });
    dialog.addEventListener('close', () => { const target = state.dialogReturnFocus; state.dialogReturnFocus = null; if (target && document.contains(target)) target.focus(); });
    window.addEventListener('storage', event => {
      if (event.key === storyStorageKey) {
        if (event.newValue === null) { storyState.unlockedDates = []; storyState.lastViewed = 0; }
        else {
          let incoming;
          try { incoming = cleanStoryProgress(JSON.parse(event.newValue)); }
          catch { return; }
          Object.assign(storyState, cleanStoryProgress({ version: 1, unlockedDates: [...incoming.unlockedDates, ...storyState.unlockedDates], lastViewed: incoming.lastViewed }));
          saveStoryProgress();
        }
        refreshStoryWidgets();
        refreshStoryReader();
        return;
      }
      if (event.key !== dailyStorageKey && event.key !== null) return;
      if (event.key === null) { storyState.unlockedDates = []; storyState.lastViewed = 0; }
      dailyState.date = currentDailyDate();
      if (event.newValue === null) {
        dailyState.days = { [dailyState.date]: { opened: true, inventory: false, orders: false } };
        saveDailyDays(false);
      } else {
        let incoming;
        try { incoming = cleanDailyDays(JSON.parse(event.newValue)); }
        catch { return; }
        dailyState.days = mergeDailyDays(incoming, dailyState.days);
        // 다른 탭이 이전 상태로 덮어써도 이미 완료한 확인은 다시 보존합니다.
        if (JSON.stringify(incoming) !== JSON.stringify(dailyState.days)) saveDailyDays(false);
      }
      recordDailyCheck('opened');
      syncStoryRewards();
      refreshDailyWidgets();
    });
    function refreshDailyDate() {
      if (document.visibilityState !== 'visible') return;
      if (currentDailyDate() !== dailyState.date) { render(); return; }
      const previousProgress = dailyProgress();
      if (state.view === 'inventory' && main.querySelector('#inventoryResults .result-summary')) recordDailyCheck('inventory');
      if (state.view === 'orders' && main.querySelector('#orderResults .result-summary')) recordDailyCheck('orders');
      if (dailyProgress() !== previousProgress) refreshDailyWidgets();
    }
    document.addEventListener('visibilitychange', refreshDailyDate);
    window.addEventListener('focus', refreshDailyDate);
    // 자정과 절전 복귀를 한국 날짜로 다시 확인합니다. 숨긴 탭에는 확인을 부여하지 않습니다.
    setInterval(() => { if (currentDailyDate() !== dailyState.date) refreshDailyDate(); }, 30000);
    render();
  </script>
</body>
</html>
